<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Get instant answers about our car workshop's prices, opening hours, repairs, and bookings.">
  <meta name="theme-color" content="#1d4ed8">
  <title>Car Workshop Assistant</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%231d4ed8'/%3E%3Cg transform='translate(5 26) scale(0.115)'%3E%3Cpath d='M62 258 L62 135 Q62 112 86 110 L505 106 Q530 106 545 125 L610 168 L715 176 Q752 182 752 215 L752 258 Z' fill='%23ffffff'/%3E%3Cpath d='M92 124 L182 123 L182 166 L92 166 Z M200 122 L412 122 L412 166 L200 166 Z M430 122 L508 121 Q522 121 532 134 L572 166 L430 166 Z' fill='%231d4ed8'/%3E%3Ccircle cx='50' cy='190' r='42' fill='%230f2a66'/%3E%3Ccircle cx='200' cy='258' r='72' fill='%231d4ed8'/%3E%3Ccircle cx='610' cy='258' r='72' fill='%231d4ed8'/%3E%3Ccircle cx='200' cy='258' r='58' fill='%230f2a66'/%3E%3Ccircle cx='610' cy='258' r='58' fill='%230f2a66'/%3E%3Ccircle cx='200' cy='258' r='26' fill='%23ffffff'/%3E%3Ccircle cx='610' cy='258' r='26' fill='%23ffffff'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="app">

    <header class="app-header">
      <div class="brand">
        <span class="logo car-emoji" aria-hidden="true"></span>
        <div class="brand-text">
          <h1>Car Workshop Assistant</h1>
          <p class="status"><span class="status-dot"></span>Online &middot; Instant answers from our FAQ</p>
        </div>
      </div>
      <button type="button" id="clear-btn" class="ghost-btn" aria-label="Clear conversation">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>
        <span>Clear</span>
      </button>
    </header>

    <div class="chat-area">
      <div class="watermark" aria-hidden="true"></div>
      <section id="chat" class="chat" aria-live="polite" aria-label="Conversation">
        <noscript><p class="noscript">Please enable JavaScript to use the assistant.</p></noscript>
      </section>
    </div>

    <nav class="topics" aria-label="Popular questions">
      <button type="button" class="chip" data-question="What are your opening hours?">🕒 Opening hours</button>
      <button type="button" class="chip" data-question="How much does an oil change cost?">💰 Oil change price</button>
      <button type="button" class="chip" data-question="How much does a brake pad replacement cost?">🛞 Brake pads</button>
      <button type="button" class="chip" data-question="How can I book a service?">📅 Book a service</button>
      <button type="button" class="chip" data-question="Do you offer a warranty on repairs?">🛡️ Warranty</button>
    </nav>

    <form id="ask-form" class="ask-form" autocomplete="off">
      <label for="question" class="visually-hidden">Your question</label>
      <div class="input-wrap">
        <input
          type="text"
          id="question"
          name="question"
          placeholder="Ask about prices, hours, repairs..."
          maxlength="300"
          enterkeyhint="send"
          required
        >
        <span id="char-count" class="char-count" aria-hidden="true">0/300</span>
      </div>
      <button type="submit" id="send-btn" class="send-btn">
        <span>Ask</span>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
      </button>
    </form>

    <p class="disclaimer">Answers come only from our workshop FAQ. For anything else, please call the workshop.</p>

  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
