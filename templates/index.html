<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Get instant answers about our car workshop's prices, opening hours, repairs, and bookings.">
  <meta name="theme-color" content="#1d4ed8">
  <title>Car Workshop Assistant</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%231d4ed8'/%3E%3Cg transform='translate(5 26) scale(0.115)'%3E%3Cpath d='M62 258 L62 135 Q62 112 86 110 L505 106 Q530 106 545 125 L610 168 L715 176 Q752 182 752 215 L752 258 Z' fill='%23ffffff'/%3E%3Cpath d='M92 124 L182 123 L182 166 L92 166 Z M200 122 L412 122 L412 166 L200 166 Z M430 122 L508 121 Q522 121 532 134 L572 166 L430 166 Z' fill='%231d4ed8'/%3E%3Ccircle cx='50' cy='190' r='42' fill='%230f2a66'/%3E%3Ccircle cx='200' cy='258' r='72' fill='%231d4ed8'/%3E%3Ccircle cx='610' cy='258' r='72' fill='%231d4ed8'/%3E%3Ccircle cx='200' cy='258' r='58' fill='%230f2a66'/%3E%3Ccircle cx='610' cy='258' r='58' fill='%230f2a66'/%3E%3Ccircle cx='200' cy='258' r='26' fill='%23ffffff'/%3E%3Ccircle cx='610' cy='258' r='26' fill='%23ffffff'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <svg class="icon-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
    <symbol id="icon-car-front" viewBox="0 0 24 24">
      <path d="m5 11 1.5-5h11L19 11M3 11h18v7H3zM6 18v2m12-2v2M6 14h.01M18 14h.01M8 11l1-3h6l1 3"/>
    </symbol>
    <symbol id="icon-bot" viewBox="0 0 24 24">
      <rect x="4" y="8" width="16" height="12" rx="3"/>
      <path d="M12 4v4m-3-4h6M2 13h2m16 0h2m-13 0h.01m5.99 0h.01M9 17h6"/>
    </symbol>
    <symbol id="icon-clock-3" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10"/>
      <path d="M12 6v6l4 2"/>
    </symbol>
    <symbol id="icon-circle-dollar-sign" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10"/>
      <path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8m4 2V6"/>
    </symbol>
    <symbol id="icon-disc-3" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10"/>
      <circle cx="12" cy="12" r="2"/>
      <path d="m16.24 7.76-2.12 2.12M7.76 16.24l2.12-2.12"/>
    </symbol>
    <symbol id="icon-calendar-days" viewBox="0 0 24 24">
      <rect x="3" y="4" width="18" height="18" rx="2"/>
      <path d="M16 2v4M8 2v4M3 10h18"/>
      <path d="M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01M16 18h.01"/>
    </symbol>
    <symbol id="icon-shield-check" viewBox="0 0 24 24">
      <path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11z"/>
      <path d="m9 12 2 2 4-4"/>
    </symbol>
  </svg>
  <div class="app">

    <header class="app-header">
      <div class="brand">
        <span class="logo" aria-hidden="true">
          <svg class="logo-icon" viewBox="0 0 24 24"><use href="#icon-car-front"></use></svg>
        </span>
        <div class="brand-text">
          <h1>Car Workshop Assistant</h1>
          <p class="status"><span class="status-dot"></span>Online &middot; Instant answers from our FAQ</p>
        </div>
      </div>
      <button type="button" id="clear-btn" class="ghost-btn" aria-label="Clear conversation">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>
        <span>Clear</span>
      </button>
    </header>

    <div class="chat-area">
      <div class="watermark" aria-hidden="true"></div>
      <section id="chat" class="chat" aria-live="polite" aria-label="Conversation">
        <noscript><p class="noscript">Please enable JavaScript to use the assistant.</p></noscript>
      </section>
    </div>

    <nav class="topics" aria-label="Popular questions">
      <button type="button" class="chip" data-question="What are your opening hours?">
        <svg class="chip-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-clock-3"></use></svg>
        <span>Opening hours</span>
      </button>
      <button type="button" class="chip" data-question="How much does an oil change cost?">
        <svg class="chip-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-circle-dollar-sign"></use></svg>
        <span>Oil change price</span>
      </button>
      <button type="button" class="chip" data-question="How much does a brake pad replacement cost?">
        <svg class="chip-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-disc-3"></use></svg>
        <span>Brake pads</span>
      </button>
      <button type="button" class="chip" data-question="How can I book a service?">
        <svg class="chip-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-calendar-days"></use></svg>
        <span>Book a service</span>
      </button>
      <button type="button" class="chip" data-question="Do you offer a warranty on repairs?">
        <svg class="chip-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-shield-check"></use></svg>
        <span>Warranty</span>
      </button>
    </nav>

    <form id="ask-form" class="ask-form" autocomplete="off">
      <label for="question" class="visually-hidden">Your question</label>
      <div class="input-wrap">
        <input
          type="text"
          id="question"
          name="question"
          placeholder="Ask about prices, hours, repairs..."
          maxlength="300"
          enterkeyhint="send"
          required
        >
        <span id="char-count" class="char-count" aria-hidden="true">0/300</span>
      </div>
      <button type="submit" id="send-btn" class="send-btn">
        <span>Ask</span>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
      </button>
    </form>

    <p class="disclaimer">Answers come only from our workshop FAQ. For anything else, please call the workshop.</p>

  </div>

  <script src="{{ url_for('static', filename='script.js', v='2') }}"></script>
</body>
</html>
